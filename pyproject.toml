[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "storyflow"
version = "0.1.0"
description = "AI-driven interactive fiction application"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.50.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "typing-extensions>=4.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.7.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.4.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
filterwarnings = [
    "error:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

