[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "storyflow"
version = "0.1.0"
description = "AI-driven interactive fiction application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.7.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100

# Temporary T02 legacy exemptions. Remove these during the formal T02 cleanup.
[tool.ruff.lint.per-file-ignores]
"src/storyflow/domain/__init__.py" = ["RUF022"]
"src/storyflow/domain/models.py" = ["F401", "UP006", "UP035", "UP045"]
"src/storyflow/domain/state_machine.py" = ["PIE790", "RUF012", "UP006", "UP035"]
"tests/unit/test_domain_models.py" = ["F401", "I001"]
"tests/unit/test_state_machine.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
