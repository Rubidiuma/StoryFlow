<span class="field-improvement-tools">
  <button class="field-improve-button" type="button" data-improve-field>AI 完善</button>
  <small class="field-incomplete-hint" data-incomplete-hint hidden>内容较少，可以让 AI 帮你补充。</small>
</span>
<span class="field-improvement-preview" data-improvement-preview hidden>
  <strong>AI 建议</strong>
  <span data-improvement-text></span>
  <span class="field-improvement-actions">
    <button class="button" type="button" data-adopt-improvement>采用</button>
    <button class="button button-secondary" type="button" data-regenerate-improvement>重新生成</button>
    <button class="button button-secondary" type="button" data-cancel-improvement>取消</button>
  </span>
</span>
