services:
  - type: web
    name: storyflow
    runtime: docker
    plan: free

    disk:
      name: storyflow-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: STORYFLOW_DB_PATH
        value: /data/storyflow.sqlite3
      - key: STORYFLOW_ENVIRONMENT
        value: production
      # Set these manually in the Render dashboard — never commit real keys
      - key: STORYFLOW_LLM_KEY
        sync: false
      - key: STORYFLOW_LLM_BASE_URL
        sync: false
      - key: STORYFLOW_LLM_MODEL
        sync: false

    healthCheckPath: /health
